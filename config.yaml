paths:
  raw_m5: data/raw/m5
  raw_id_pharmacy: data/raw/id_pharmacy
  external: data/external
  interim: data/interim
  processed: data/processed
  reports: reports

m5:
  sales_file: sales_train_evaluation.csv
  calendar_file: calendar.csv
  prices_file: sell_prices.csv

validation:
  horizon: 28
  # Tiap fold CV memprediksi 28 hari setelah cutoff-nya; tidak boleh menyentuh holdout.
  cv_cutoffs: [1801, 1829, 1857, 1885]
  holdout_cutoff: 1913   # holdout = d_1914 .. d_1941, hanya disentuh sekali di akhir
  # Fold khusus: dilaporkan terpisah, tidak pernah dirata-rata ke skor CV utama.
  extra_folds:
    easter_2014: 1164    # horizon d_1165-d_1192 memuat Easter 2014 (d_1178, juga OrthodoxEaster)
    easter_2015: 1514    # horizon d_1515-d_1542 memuat Easter 2015 (d_1528)
    year_end_2015: 1773  # horizon d_1774-d_1801 memuat Natal + Tahun Baru
  early_stopping_days: 28  # N hari terakhir jendela train tiap fold, di dalam cutoff
  min_history_days: 420    # lag 364 + rolling 56 harus tersedia sebelum cutoff pertama

# Hari toko praktis tutup (Fase 2: <10% penjualan normal, hanya 25 Des).
# Dikeluarkan dari target training dan statistik rolling; forecast diisi 0.
closed_days:
  month_day: [[12, 25]]

features:
  lags: [28, 35, 42, 49, 56, 364]   # semua >= horizon, jadi aman tanpa prediksi rekursif
  rolling_windows: [7, 14, 28, 56]  # mean/std dari lag 28
  price_max_window: 56              # hari, untuk harga relatif terhadap harga maks terakhir
  discount_threshold: 0.99          # harga < 99% harga maks 56 hari -> dianggap diskon
  moving_events:                    # nama event di calendar.csv: batas (clip) hari
    Easter: 7

# Konfigurasi model final, dipilih lewat reports/data/xgb_experiments.json (Fase 5).
model:
  xgb_point:
    params:
      objective: "reg:tweedie"
      tweedie_variance_power: 1.1   # E1: terbaik dari 1,1/1,2/1,3/1,5, poisson, squarederror
      max_bin: 256
      eta: 0.05
      max_depth: 8
      min_child_weight: 10
      subsample: 0.8
      colsample_bytree: 0.8
      seed: 42
    options:
      item_encoding: label          # E2: kategorikal lebih buruk dan model 18x lebih besar
      exclude_censored: true        # E3: deretan nol >= 28 hari item laris dikeluarkan dari training
      censor_run: 28
      busy_share: 0.5
      refit: false                  # E4 + tahap 3: latih ulang tidak membantu
      max_rounds: 3000
      early_stopping: 100
  # Kandidat hasil tuning (reports/tree_tuning.md): sama dengan xgb_point kecuali
  # min_child_weight. DITOLAK di konfirmasi 10 toko × 4 fold (0,5790 vs 0,5819, selisih < tau
  # 0,007). Disimpan agar run konfirmasinya bisa diulang; tidak dipakai di pipeline.
  xgb_point_tuned:
    params:
      objective: "reg:tweedie"
      tweedie_variance_power: 1.1
      max_bin: 256
      eta: 0.05
      max_depth: 8
      min_child_weight: 200         # tuning T2: 0,6803 vs 0,6903 di CA_3+WI_2 (tau 0,007)
      subsample: 0.8
      colsample_bytree: 0.8
      seed: 42
    options:
      item_encoding: label
      exclude_censored: true
      censor_run: 28
      busy_share: 0.5
      refit: false
      max_rounds: 3000
      early_stopping: 100
  xgb_quantile:
    params:
      objective: "reg:quantileerror"
      quantile_alpha: [0.1, 0.5, 0.8, 0.9]
      max_bin: 256
      eta: 0.2                      # reports/data/quantile_experiments.json: pinball terendah (7 dari 8 run); lihat phase5_models.md §8.2
      max_depth: 8
      min_child_weight: 10
      subsample: 0.8
      colsample_bytree: 0.8
      seed: 42
    options:
      item_encoding: label
      exclude_censored: true        # Fase 7 mensimulasikan permintaan, bukan penjualan
      censor_run: 28
      busy_share: 0.5
      refit: false
      max_rounds: 1000              # uji hingga 3.000 tidak membantu (reports/quantile_cap3000_comparison.md)
      early_stopping: 100

# Fase 7: simulasi stok. M5 tidak memuat data biaya maupun persediaan, jadi SEMUA nilai di
# bawah adalah ASUMSI (bukan data), dan diuji sensitivitasnya.
inventory:
  review_period_days: 7             # asumsi: stok dicek dan dipesan seminggu sekali
  lead_time_days: 2                 # asumsi: pesanan tiba 2 hari setelah dipesan
  service_quantiles: [0.5, 0.8, 0.9]              # kuantil model XGBoost yang tersedia (dilatih di Fase 5)
  baseline_quantiles: [0.5, 0.6, 0.7, 0.8, 0.9, 0.95, 0.98, 0.99, 0.995]   # metode normal/empiris: grid lebih rapat untuk kurva trade-off
  cover_grid_days: [4, 6, 8, 10, 12, 14]           # stok rata-rata (hari) untuk membandingkan fill rate antar metode
  holding_cost_annual_rate: 0.25    # asumsi: biaya simpan per tahun = 25% harga barang
  stockout_cost_rate: 0.30          # asumsi: kerugian per unit tidak terlayani = 30% harga (margin)
  sensitivity:
    holding_cost_annual_rate: [0.15, 0.25, 0.40]
    stockout_cost_rate: [0.10, 0.30, 0.50, 1.00]
  sigma_window_days: 56             # simpangan baku harian untuk safety stock (baseline normal)
  empirical_window_days: 364        # riwayat untuk kuantil empiris permintaan selama periode proteksi
  growth_risk_ratio: 2.0            # item "tumbuh cepat" (Fase 6 §8.5): rata-rata 56 hari / rata-rata riwayat > 2

# Fase 8: data apotek Indonesia (jalur "tidak cukup", reports/id_data_audit.md).
# Desain ditetapkan SEBELUM hasil dihitung (reports/id_phase8_design.md).
id_pharmacy:
  complete_start: "2015-04-01"      # audit §3: header nota Jan-Mar sebagian besar hilang
  end: "2015-12-31"
  event_study:
    series: [all, RJ, RI]           # nota per hari; unit per hari (all) sebagai metrik kedua
    event_period: ["2015-06-18", "2015-08-18"]   # 1 Ramadan s.d. akhir jendela pasca Lebaran ke-2
    windows:                        # jendela patokan [awal, akhir] inklusif, dari tanggal resmi
      ramadan_w1_2: ["2015-06-18", "2015-07-01"]
      ramadan_w3_4: ["2015-07-02", "2015-07-15"]
      lebaran_cuti: ["2015-07-16", "2015-07-21"]  # cuti bersama + Idulfitri + cuti bersama
      post_1: ["2015-07-22", "2015-08-04"]
      post_2: ["2015-08-05", "2015-08-18"]
    # Dipilih lewat kalibrasi plasebo di luar periode event (reports/data/id_event_calibration.json):
    window_days: 7                  # jendela patokan 14 hari dipecah per minggu; noise hampir sama dengan 14 hari
    baseline_method: local_level_28 # RMS plasebo terendah dari 5 kandidat (0,061 vs 0,062-0,079)
  forecast:
    horizon: 14
    cv_cutoffs: ["2015-09-10", "2015-09-24", "2015-10-08", "2015-10-22",
                 "2015-11-05", "2015-11-19", "2015-12-03", "2015-12-17"]
    extra_folds:                    # dilaporkan terpisah, tidak dirata-rata ke skor CV utama
      lebaran: "2015-07-09"         # horizon 10-23 Jul: cuti bersama + Idulfitri
      post_lebaran: "2015-07-23"    # horizon 24 Jul-6 Agu: penurunan yang terlihat di audit §8
    lags: [14, 21, 28]              # semua >= horizon, tanpa prediksi rekursif
    rolling_windows: [7, 14, 28]    # mean dari lag 14
    product_min_share_days: 0.5     # produk = terjual di >= 50% hari train fold itu
    early_stopping_days: 14
    params:                         # ditetapkan di awal, TIDAK di-tuning (data terlalu kecil untuk tuning + evaluasi jujur)
      objective: "reg:tweedie"
      tweedie_variance_power: 1.1
      eta: 0.05
      max_depth: 4
      min_child_weight: 10
      subsample: 0.8
      colsample_bytree: 0.8
      seed: 42
    max_rounds: 2000
    early_stopping: 100

seed: 42
