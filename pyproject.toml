[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retailfc"
version = "0.1.0"
description = "Retail demand forecasting (M5 Walmart -> Indonesia) with XGBoost"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=14",
    "xgboost>=2.0",
    "scikit-learn>=1.3",
    "shap>=0.44",
    "statsforecast>=1.7",
    "holidays>=0.40",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "psutil>=5.9",
    "kaggle>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
